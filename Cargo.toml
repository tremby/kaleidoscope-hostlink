[package]
name = "kaleidoscope-hostlink"
version = "0.1.0"
edition = "2021"
description = "Push desktop state to a Kaleidoscope keyboard for LED effects"

[dependencies]
serde_json = "1"
libc = "0.2"
signal-hook = "0.4"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
sha2 = "0.11"
base64 = "0.23"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
