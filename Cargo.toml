[package]
name = "kaleidoscope-hostlink"
version = "0.1.0"
edition = "2021"
description = "Push desktop state to a Kaleidoscope keyboard for LED effects"

[dependencies]
serde_json = "1"
# The serial port is opened directly via termios. NEVER set a 1200 baud rate:
# the 32U4 treats a 1200 baud open as "reboot into the bootloader".
libc = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
